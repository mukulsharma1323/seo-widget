<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Widget</title>
  <style>
    body{width:300px;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;margin:0}
    .container{text-align:center}
    h1{font-size:18px;margin:0 0 15px 0;color:#333}
    button{background-color:#4caf50;color:#fff;border:none;padding:12px 24px;font-size:14px;cursor:pointer;border-radius:4px;width:100%;font-weight:500;transition:background-color .3s}
    button:hover{background-color:#45a049}
    button:active{background-color:#3d8b40}
    .status{margin-top:15px;padding:10px;border-radius:4px;font-size:12px;display:none}
    .status.success{background-color:#d4edda;color:#155724;border:1px solid #c3e6cb;display:block}
    .status.error{background-color:#f8d7da;color:#721c24;border:1px solid #f5c6cb;display:block}
    .description{font-size:12px;color:#666;margin-bottom:15px;line-height:1.4}
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 SEO Widget</h1>
    <p class="description">Click the button below to highlight all heading tags (h1-h6) on this page with different colors.</p>
    <button id="highlightBtn">Highlight Headings</button>
    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
